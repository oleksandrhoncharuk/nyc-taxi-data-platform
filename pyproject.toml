[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

exclude = [
    ".venv",
    "dbt/traget",
    "dbt/logs",
    "dbt/dbt_packages",
    "airflow/logs",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
