version: 2

models:
  - name: dim_zones
    columns:
      - name: location_id
        data_tests:
          - not_null
          - unique

      - name: zone
        data_tests:
          - not_null

  - name: fact_trips
    columns:
      - name: pickup_datetime
        data_tests:
          - not_null

      - name: dropoff_datetime
        data_tests:
          - not_null

      - name: pickup_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id

      - name: dropoff_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id
