version: 2

models:
  - name: stg_taxi_zones
    columns:
      - name: location_id
        data_test:
          - not_null
          - unique
      - name: zone
        data_tests:
          - not_null

  - name: stg_yellow_taxi_trips
    columns:
      - name: pickup_datetime
        data_tests:
          - not_null

      - name: dropoff_datetime
        data_tests:
          - not_null

      - name: pickup_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_taxi_zones')
                field: location_id

      - name: dropoff_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_taxi_zones')
                field: location_id